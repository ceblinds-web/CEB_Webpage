name: Supabase keep-alive

on:
  schedule:
    - cron: '0 15 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_ANON_KEY repo secret"
            exit 1
          fi
          SUPABASE_URL="${SUPABASE_URL%/}"
          STATUS=$(curl -s -o /tmp/resp.json -w "%{http_code}" --max-time 30 \
            "$SUPABASE_URL/rest/v1/customers?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Ping failed — response:"
            cat /tmp/resp.json
            exit 1
          fi
          echo "Supabase responded OK"
